<form id="reviewsForm" name="reviewsForm" class="form" novalidate data-part="reviewBody">
  <span class="hidden-message">{{message}}</span>
  <section class="row search-group">{% include "partials/pagination.html"%}</section>
  <input type="hidden" id="page" name="page" value="{{filter.page}}" />
</form>
<ul class="row list">
  {% for item in list %}
  <li class="col s12 m6 l4 xl3 review-item">
    <header>
      <strong>{{item.displayName}}</strong>
      <div class="review-item-stars" {{item.percent}}></div>
    </header>
    <p class="center-align-items">{{item.time}}</p>
    <p>{{item.review}}</p>
  </li>
  {% endfor %}
</ul>
