<div class="profile">
  {% include "pages/user/header.html" %}
  <nav class="tabs">
    <a class="tab" href="/profiles/{{user.username}}" onclick="navigate(event, 'userBody')">
      {{resource.overview}}</a>
    <a class="tab" href="/profiles/{{user.username}}/articles" onclick="navigate(event, 'userBody')">
      {{resource.articles}}</a>
    <a class="tab" href="/profiles/{{user.username}}/followers" onclick="navigate(event, 'userBody')">
      {{resource.followers}}</a>
    <a class="tab active" href="/profiles/{{user.username}}/following" onclick="navigate(event, 'userBody')">
      {{resource.following}}</a>
    <a class="tab" href="/profiles/{{user.username}}/companies" onclick="navigate(event, 'userBody')">
      {{resource.companies}}</a>
  </nav>
  <div id="userBody" class="profile-body">
    {% include "pages/user/following.html" %}
  </div>
  <script data-init-script="true">
    resources.load = function (pageBody) {
      const page = document.getElementById("profilePage")
      const trigger = document.getElementById("headerTrigger")
      const header = document.getElementById("profileHeader")
      const observer = new IntersectionObserver(
        ([entry]) => {
          if (entry.isIntersecting) {
            header.classList.remove("compact")
          }
          else {
            header.classList.add("compact")
          }
        },
        {
          root: page,
          threshold: 0
        }
      )
      observer.observe(trigger)
    }
  </script>
</div>
