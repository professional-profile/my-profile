<article class="article">
  <header>
    <button type="button" id="btnBack" name="btnBack" class="btn-back" onclick="goBack()"></button>
    <h2>{{article.title}}</h2>
  </header>
  <div class="article-body">
    <h4 class="article-description">{{article.description}}</h4>
    <h4 class="article-meta">
      {{article.publishedAt}}
      {% if account %}
      {% if article.isSaved %}
      <i class="material-icons" onclick="removeItem(this, '{{article.id}}', true)">bookmark</i>
      {% else %}
      <i class="material-icons" onclick="saveItem(this, '{{article.id}}'), true">bookmark_border</i>
      {% endif %}
      {% endif %}
    </h4>
    <div class="article-content">{{article.content}}</div>
    <h4 class="article-meta">{{generateTags(article.tags, true)}}</h4>
  </div>
</article>
