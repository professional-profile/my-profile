<div>
  <header>
    <h2>{{resource.companies}}</h2>
  </header>
  <div class="main-body">
    <form id="companiesForm" name="companiesForm" class="form" novalidate>
      <span class="hidden-message">{{message}}</span>
      <section class="row search-group">
        <label class="col s12 m6 search-input">{% include "partials/advance-search.html" %}</label>
        {% include "partials/pagination.html" %}
      </section>
      <section class="row search-group inline advance-search" hidden>
        <label class="col s12 m4">
          {{resource.email}}
          <input type="text" id="email" name="email" value="{{filter.email}}" maxlength="40" />
        </label>
      </section>
      <input type="hidden" id="page" name="page" value="{{filter.page}}" />
    </form>
    <ul class="row list">
      {% for company in list %}
      <li class="col s12 m6 l4 xl3 img-item">
        <img src="{{company.logo}}" alt="company logo" class="round-border" />
        <a href="/companies/{{company.slug}}{{langSearch}}" onclick="navigate(event)">{{company.companyName}}</a>
        <button class="btn-detail"></button>
      </li>
      {% endfor %}
    </ul>
  </div>
</div>
