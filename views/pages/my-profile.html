<div id="myprofilePage" class="profile">
  {% include "pages/my-profile/header.html" %}
  <div id="myProfileBody" class="profile-body">
    {% include "pages/my-profile/main.html" %}
  </div>
  <script data-init-script="true">
    resources.load = function (pageBody) {
      const page = document.getElementById("myprofilePage")
      const trigger = document.getElementById("headerTrigger")
      const header = document.getElementById("myprofileHeader")
      const observer = new IntersectionObserver(
        ([entry]) => {
          if (entry.isIntersecting) {
            header.classList.remove("compact")
          }
          else {
            header.classList.add("compact")
          }
        },
        {
          root: page,
          threshold: 0
        }
      )
      observer.observe(trigger)
    }
  </script>
</div>
