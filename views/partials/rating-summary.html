<div class="rating-summary">
  <div class="score">
    <div id="avgValue" class="value">{{rate.rate}}</div>
    <div id="avgStars" class="stars">
      <span {{rate.star1}}></span>
      <span {{rate.star2}}></span>
      <span {{rate.star3}}></span>
      <span {{rate.star4}}></span>
      <span {{rate.star5}}></span>
    </div>
    <div id="count" class="muted">{{rate.count}} ratings</div>
  </div>
  <div class="bars">
    <div class="bar">
      <span class="bar-stars">★★★★★</span>
      <div class="track">
        <div class="fill" {{rate.rate5}}></div>
      </div>
    </div>
    <div id="bars" class="bar">
      <span class="bar-stars">★★★★☆</span>
      <div class="track">
        <div class="fill" {{rate.rate4}}></div>
      </div>
    </div>
    <div class="bar">
      <span class="bar-stars">★★★☆☆</span>
      <div class="track">
        <div class="fill" {{rate.rate3}}></div>
      </div>
    </div>
    <div class="bar">
      <span class="bar-stars">★★☆☆☆</span>
      <div class="track">
        <div class="fill" {{rate.rate2}}></div>
      </div>
    </div>
    <div class="bar">
      <span class="bar-stars">★☆☆☆☆</span>
      <div class="track">
        <div class="fill" {{rate.rate1}}></div>
      </div>
    </div>
  </div>
</div>
